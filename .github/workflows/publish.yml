name: Publish to npm

# Publishes client -> cli to npm on a published GitHub Release, using OIDC Trusted
# Publishing — NO npm token. Provenance attestations are emitted automatically.
# (@agentx402-ai/core is released separately from its own repo, agentx402-ai/core.)
#
# One-time setup (required before this works): configure a Trusted Publisher on EACH of
# @agentscout/client, @agentscout/cli at npmjs.com → package → Settings → Trusted Publisher →
# GitHub Actions → repository "agentx402-ai/agentscout", workflow "publish.yml". Bump the
# version in every source (see RELEASING.md) before cutting the Release, or the publish
# fails on an already-published version.

on:
  release:
    types: [published]
  # Manual re-run path: a release-event rerun reuses the workflow file snapshotted
  # at the tag's commit, so a fixed workflow on main needs its own trigger.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1 (required for OIDC trusted publishing)
          # NATIVELY. Do not reintroduce `npm install -g npm@latest`: npm
          # overwriting itself in-place is exactly what corrupted the bundle on
          # the first v0.2.0 publish attempt (provenance.js → missing 'sigstore').
          node-version: 24
          # registry-url IS required: without it npm has no registry configured for the
          # scoped packages and never initiates the OIDC exchange at all (it fails
          # ENEEDAUTH instead). But setting it makes setup-node write an .npmrc line
          #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and with no token set — this workflow is OIDC-only by design — npm uses that
          # empty placeholder credential INSTEAD of doing the OIDC exchange, authenticates
          # as anonymous, and the registry answers an anonymous PUT with a misleading
          # `E404 Not Found` rather than a 403.
          #
          # So we need registry-url AND we need that one line gone. See the next step.
          # Upstream bug: https://github.com/actions/setup-node/issues/1551
          registry-url: https://registry.npmjs.org

      # Auth selection. OIDC (trusted publishing) is PREFERRED and is what runs when no
      # NPM_TOKEN secret exists — which is the default state of this repo.
      #
      # OIDC path: setup-node's registry-url writes
      #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no token that placeholder gets used INSTEAD of the OIDC exchange, so npm
      # authenticates as anonymous and the registry answers PUT with a misleading E404.
      # Deleting that line is what lets npm fall through to OIDC.
      # Upstream: https://github.com/actions/setup-node/issues/1551
      #
      # Token path: engaged ONLY if the NPM_TOKEN secret is present. It exists because
      # npm's OIDC exchange currently rejects this package with
      #     POST 404 /-/npm/v1/oidc/token/exchange/package/@agentscout%2fclient
      #     "OIDC token exchange error - package not found"
      # despite a correct Trusted Publisher config — a known, unresolved npm bug affecting
      # SCOPED packages (npm/cli#8678, #8730, #8976; no maintainer fix as of 2026-07-26).
      # Provenance is NOT lost on this path: `--provenance` still attests, because
      # `permissions: id-token: write` is granted either way.
      #
      # Delete the secret to return to OIDC once npm fixes the bug — no workflow edit.
      - name: Select auth (OIDC by default; NPM_TOKEN only if the secret exists)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "$NPM_TOKEN" ]; then
            sed -i '/_authToken/d' "$npmrc"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$npmrc"
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "auth: NPM_TOKEN present -> token auth (+ --provenance)"
          else
            sed -i '/_authToken/d' "$npmrc"
            echo "AUTH_MODE=oidc" >> "$GITHUB_ENV"
            echo "auth: no NPM_TOKEN -> OIDC trusted publishing"
          fi
          echo "npmrc (redacted):"; sed 's/_authToken=.*/_authToken=<redacted>/' "$npmrc"

      - run: npm --version # publish provenance path needs an intact npm bundle
      # NO PREFLIGHT AUTH CHECK — one is not possible here, and the previous attempt
      # at one was itself the bug. It ran `npm access list packages @agentscout`, which
      # 401s under OIDC *regardless of whether the Trusted Publisher is configured*:
      # npm's OIDC exchange is scoped to `npm publish` / `npm stage publish` ONLY. Per
      # npm's docs, "other npm commands like access, install, or view still require
      # traditional authentication methods", and `npm whoami` "will not reflect OIDC
      # authentication status since the authentication occurs only during the publish
      # or stage operation". With no NPM_TOKEN by design, setup-node's registry-url
      # writes an .npmrc referencing an unset NODE_AUTH_TOKEN, so any non-publish call
      # authenticates as nobody. The gate could never go green, and it blocked a
      # correctly-configured v0.2.0 release on 2026-07-26.
      #
      # There is no cheap way to test publish authorization short of publishing. So we
      # publish, and explain clearly IF it fails (see the failure step at the end).
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Published from INSIDE each workspace, not via `npm publish -w <name>`. The
      # workspace flag takes a different code path in npm and the OIDC exchange was not
      # attempted at all under it (immediate ENEEDAUTH, ~1.5s, with the OIDC env vars
      # verifiably present and the npmrc clean). Every known-good trusted-publishing
      # example publishes from the package directory. Order matters: client before cli,
      # since cli depends on it.
      - name: Publish client (verbose — surfaces the OIDC exchange result)
        working-directory: client
        run: |
          set +e
          # --provenance only on the token path; OIDC attests automatically.
          FLAGS=""; [ "$AUTH_MODE" = "token" ] && FLAGS="--provenance"
          npm publish $FLAGS --loglevel verbose 2>&1 | tee /tmp/pub.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "=================== OIDC exchange result ==================="
          grep -iE "oidc|token/exchange|needauth" /tmp/pub.log || echo "(npm never attempted OIDC — check the npmrc strip step above)"
          exit $CODE
      - name: Publish cli (verbose — same OIDC diagnostics as client)
        working-directory: cli
        run: |
          set +e
          # --provenance only on the token path; OIDC attests automatically.
          FLAGS=""; [ "$AUTH_MODE" = "token" ] && FLAGS="--provenance"
          npm publish $FLAGS --loglevel verbose 2>&1 | tee /tmp/pub-cli.log
          CODE=${PIPESTATUS[0]}
          set -e
          grep -iE "oidc|token/exchange|needauth" /tmp/pub-cli.log || true
          exit $CODE

      # Runs only if a publish step above failed. Restores the diagnostic the old
      # preflight was trying to provide, without gating on a check that cannot pass.
      - name: Explain a publish failure
        if: failure()
        # Quoted heredoc: disables ALL shell expansion. This is prose full of backticks
        # and $-signs, and in a double-quoted echo backticks are COMMAND SUBSTITUTION.
        run: |
          cat <<'EOF'
          ::error title=npm publish failed::Read the "OIDC exchange result" lines above first.
          EOF
          cat <<'EOF'

          READ THE OIDC EXCHANGE LINES ABOVE — they say which half failed.

          1) "POST 404 .../-/npm/v1/oidc/token/exchange/package/@agentscout%2f..."
             + "OIDC token exchange error - package not found"
             GitHub issued the token fine; npm's REGISTRY declined it. npm has no
             trusted-publisher configuration matching this package. Note it says
             "package not found" even when the package exists and is published — it
             means "no publisher config matches", not "no such package".
             Check on npmjs.com for EACH of @agentscout/client and @agentscout/cli:
               package -> Settings -> Trusted Publisher -> GitHub Actions
                 repository:  agentx402-ai/agentscout
                 workflow:    publish.yml        (filename only, not a path)
                 environment: release            <- MUST match this job's `environment:`
                                                    exactly, including being EMPTY if the
                                                    job declares none
             Config on the ORG does not substitute for per-package config.

          2) No OIDC lines at all, immediate ENEEDAUTH
             npm never tried. The npmrc still has an _authToken line — check the strip
             step. setup-node's registry-url writes a placeholder token that npm uses in
             preference to OIDC, authenticating as anonymous.

          3) "EEXIST" / "cannot publish over previously published version"
             Version already published. Bump every source per RELEASING.md and re-tag.

          Re-run via workflow_dispatch, NOT a release re-run: a release rerun replays the
          workflow file snapshotted at the tag, so a fix on main is ignored.
          EOF
