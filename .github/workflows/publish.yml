name: Publish to npm

# Publishes client -> cli to npm on a published GitHub Release, using OIDC Trusted
# Publishing — NO npm token. Provenance attestations are emitted automatically.
# (@agentx402-ai/core is released separately from its own repo, agentx402-ai/core.)
#
# One-time setup (required before this works): configure a Trusted Publisher on EACH of
# @agentscout/client, @agentscout/cli at npmjs.com → package → Settings → Trusted Publisher →
# GitHub Actions → repository "agentx402-ai/agentscout", workflow "publish.yml". Bump the
# version in every source (see RELEASING.md) before cutting the Release, or the publish
# fails on an already-published version.

on:
  release:
    types: [published]
  # Manual re-run path: a release-event rerun reuses the workflow file snapshotted
  # at the tag's commit, so a fixed workflow on main needs its own trigger.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1 (required for OIDC trusted publishing)
          # NATIVELY. Do not reintroduce `npm install -g npm@latest`: npm
          # overwriting itself in-place is exactly what corrupted the bundle on
          # the first v0.2.0 publish attempt (provenance.js → missing 'sigstore').
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version # publish provenance path needs an intact npm bundle
      # Preflight: prove we can actually authenticate BEFORE spending a build+test on a
      # publish that cannot succeed. Every run of this workflow to date (v0.1.0 on
      # 2026-07-16, v0.1.1 on 2026-07-25) died at `npm publish` with a bare
      # `E404 Not Found - PUT @agentscout%2fclient`, which reads like "package missing"
      # but actually means "this identity may not publish here". With OIDC and no token,
      # by far the likeliest cause is that the Trusted Publisher was never registered on
      # npmjs.com — it is per-PACKAGE config that cannot be set from CI, so the workflow
      # can only detect and explain it.
      - name: Preflight — can this run publish?
        run: |
          set +e
          OUT="$(npm access list packages @agentscout 2>&1)"
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=npm publish is not authorized::Cannot authenticate to the npm registry as a publisher of @agentscout/*."
            echo ""
            echo "Most likely cause: the Trusted Publisher is not configured for these packages."
            echo "This workflow publishes via OIDC with NO npm token, which requires per-package setup"
            echo "that cannot be done from CI."
            echo ""
            echo "Fix, for BOTH @agentscout/client and @agentscout/cli, on npmjs.com:"
            echo "  package -> Settings -> Trusted Publisher -> GitHub Actions"
            echo "    repository: agentx402-ai/agentscout"
            echo "    workflow:   publish.yml"
            echo "    environment: release"
            echo "Then re-run this workflow via workflow_dispatch (NOT a release re-run --"
            echo "that replays the workflow file snapshotted at the tag)."
            echo ""
            echo "Alternative: add an NPM_TOKEN secret with publish rights and set it as"
            echo "NODE_AUTH_TOKEN on the publish steps. That trades away OIDC provenance attestations."
            echo ""
            echo "npm said:"
            echo "$OUT"
            exit 1
          fi
          echo "npm publish authorization OK for @agentscout/*"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish -w client
      - run: npm publish -w cli
